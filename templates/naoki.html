<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naoki</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="naoki-text naoki-text_color_white">なおき</div>
      <div class="square square_background-color_black">
        <div class="naoki">
          <div class="face face_background-color_white">
            <div
              class="ear ear_border-bottom-color_white ear_border-left-color-border-right-color_transparent ear-one"
            >
              <div
                class="inner-ear inner-ear_border-bottom-color_salmon_pink inner-ear-one inner-ear-one_border-left-color_transparent"
              ></div>
            </div>
            <div
              class="ear ear_border-bottom-color_white ear_border-left-color-border-right-color_transparent ear-two"
            >
              <div
                class="inner-ear inner-ear_border-bottom-color_salmon_pink inner-ear-two inner-ear-two_border-right-color_transparent"
              ></div>
            </div>
            <div class="eye eye_background-color_amber-gold eye-one">
              <div class="eyeball eyeball_background-color_black"></div>
            </div>
            <div class="eye eye_background-color_amber-gold eye-two">
              <div class="eyeball eyeball_background-color_black"></div>
            </div>
            <div
              class="nose nose_border-top_color_cotton-candy nose_border-left-border-right_color_transparent"
            >
              <div
                class="nostril nostril_background-color_cotton-candy nostril-one"
              ></div>
              <div
                class="nostril nostril_background-color_cotton-candy nostril-two"
              ></div>
            </div>
            <div
              class="mark-face mark-face_background-color_amber-earth mark-face-one"
            ></div>
            <div
              class="mark-face mark-face_background-color_amber-earth mark-face-two"
            ></div>
          </div>
          <div class="body body_background-color_white">
            <div class="paw paw_background-color_white paw-one"></div>
            <div class="paw paw_background-color_white paw-two"></div>
            <div class="tail tail_background-color_amber-earth"></div>
            <div class="mark-body mark-body_background-color_amber-earth"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
