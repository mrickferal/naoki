<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naoki</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- Style for Naoki's tumbnail -->
    <link rel="stylesheet" href="../assets/css/naoki-amber-gold-inner.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="naoki-text naoki-text_color_amber-gold">なおき</div>
      <div class="square square_background-color_black">
        <div class="naoki">
          <div class="face face_background-color_amber-gold">
            <div
              class="ear ear_border-bottom-color_black ear_border-left-color-border-right-color_transparent ear-one"
            >
              <div
                class="inner-ear inner-ear_border-bottom-color_amber-gold inner-ear_border-left-color-border-right-color_transparent inner-ear-one"
              ></div>
            </div>
            <div
              class="ear ear_border-bottom-color_black ear_border-left-color-border-right-color_transparent ear-two"
            >
              <div
                class="inner-ear inner-ear_border-bottom-color_amber-gold inner-ear_border-left-color-border-right-color_transparent inner-ear-two"
              ></div>
            </div>
            <div
              class="eye eye_background-color_amber-gold eye_border-color_black eye-one"
            >
              <div class="eyeball eyeball_background-color_black"></div>
            </div>
            <div
              class="eye eye_background-color_black eye_border-color_black eye-two"
            >
              <div class="eyeball eyeball_background-color_black"></div>
            </div>
            <div
              class="nose nose_border-top_color_black nose_border-left-border-right_color_transparent"
            >
              <div
                class="nostril nostril_background-color_black nostril-one"
              ></div>
              <div
                class="nostril nostril_background-color_black nostril-two"
              ></div>
            </div>
            <div
              class="mark-face mark-face_background-color_amber-gold mark-face_border-color_black mark-face-one"
            ></div>
            <div
              class="mark-face mark-face_background-color_amber-gold mark-face_border-color_black mark-face-two"
            ></div>
          </div>
          <div class="body body_background-color_amber-gold">
            <div
              class="paw paw_background-color_amber-gold paw_border-color_black paw-one"
            ></div>
            <div
              class="paw paw_background-color_amber-gold paw_border-color_black paw-two"
            ></div>
            <div class="tail tail_background-color_amber-gold"></div>
            <div class="mark-body mark-body_background-color_amber-gold"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
